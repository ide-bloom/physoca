[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physoca"
version = "0.1.0"
description = "Deterministic, rule-based deprescribing decision-support tool for older adults"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Physoca Contributors"},
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "jinja2>=3.1.4",
    "weasyprint>=62.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "types-jsonschema>=4.23.0",
]
build = [
    "pyinstaller>=6.0.0",
    "pywebview>=5.0.0",
]

[project.scripts]
physoca = "physoca.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
physoca = [
    "rules/*.json",
    "rules/*.yaml",
    "rules/packs/*.yaml",
    "rules/scales/*.yaml",
    "report/templates/*.html",
    "report/static/*",
    "i18n/*.json",
    "reference/*.db",
    "reference/*.yaml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=physoca --cov-report=term-missing"
