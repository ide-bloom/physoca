    reaction_ingredients: [omeprazole, pantoprazole, lansoprazole, rabeprazole, esomeprazole]
    mechanism: Anticholinergic-induced reflux or dyspepsia treated with a PPI.
    source_id: trenaman_2022
    verified: true
  - id: CASC-003
