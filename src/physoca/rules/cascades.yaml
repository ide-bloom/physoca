# Documented prescribing cascades in older adults.
schema_version: 1
cascades:
  - id: CASC-001
    index_class_or_drug: dihydropyridine_ccb
    index_ingredients: [amlodipine, nifedipine, felodipine]
    reaction_drug_or_class: loop_diuretic
    reaction_ingredients: [furosemide, bumetanide, torsemide]
