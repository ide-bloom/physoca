name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" pip-audit
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: physoca rules validate
      - run: physoca sources check
      - run: pytest --cov-fail-under=90
      - run: pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t physoca:ci .

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: pyinstaller physoca.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: physoca-windows-exe
          path: dist/physoca.exe
